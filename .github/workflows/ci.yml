# CI: build + tests, and the public-safety scan (docs/public-safety.md).
# Every job is bounded by a timeout and superseded runs are cancelled.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore MordWare.slnx

      # CI verifies the code; it never packs. Packing is release.yml's job (PROD only).
      - name: Build
        run: dotnet build MordWare.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --solution MordWare.slnx -c Release --no-build

  public-safety:
    name: Public safety
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # SHA-256 of gitleaks_<version>_windows_x64.zip, from the release's checksums file.
      GITLEAKS_SHA256: d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the scan covers the full history

      - name: Install gitleaks (pinned, checksum-verified)
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'gitleaks.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'gitleaks'
          Invoke-WebRequest -Uri "https://github.com/gitleaks/gitleaks/releases/download/v$env:GITLEAKS_VERSION/gitleaks_${env:GITLEAKS_VERSION}_windows_x64.zip" -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($hash -ne $env:GITLEAKS_SHA256) { throw "gitleaks checksum mismatch: $hash" }
          Expand-Archive -LiteralPath $zip -DestinationPath $dir
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $dir

      - name: History (identities + gitleaks over every commit)
        shell: pwsh
        run: ./scripts/check-public-safety.ps1 -History

      - name: Tracked files
        shell: pwsh
        run: ./scripts/check-public-safety.ps1 -All

      - name: Self-test of the checks
        shell: pwsh
        run: ./scripts/check-public-safety.ps1 -SelfTest
